name: Build JSON from Master Excel

on:
  push:
    paths:
      - "data/public/RAILCORE_Infrastructure_GitHubMaster.xlsx"
      - "scripts/xlsx_to_json.py"
      - ".github/workflows/xlsx-to-json.yml"

jobs:
  build-json:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl

    - name: Convert Excel → JSON
      run: |
        python scripts/xlsx_to_json.py

    - name: Commit updated JSON files
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/json/*.json
        git commit -m "Auto-update JSON from master Excel" || echo "No changes"
        git push
