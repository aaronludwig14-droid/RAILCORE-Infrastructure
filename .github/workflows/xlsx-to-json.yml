name: Convert Master Workbook to JSON

on:
  push:
    paths:
      - 'data/RAILCORE_Infrastructure_GitHubMaster.xlsx'

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.x"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openpyxl pandas

    - name: Run conversion script
      run: |
        python scripts/convert_master_to_json.py

    - name: Commit JSON output
      run: |
        git config user.name "RailCore AutoUpdate"
        git config user.email "actions@github.com"
        git add data/json/*.json
        git commit -m "Auto-update JSON from master workbook" || echo "No changes"
        git push
