name: Build sidings.json from Excel

on:
  push:
    paths:
      - "data/public/RAILCORE_Master_Sidings.xlsx"
      - "scripts/xlsx_to_json.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-json:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Convert Excel to JSON
        run: |
          python scripts/xlsx_to_json.py

      - name: Commit updated JSON (if changed)
        run: |
          if git status --porcelain | grep "data/json/sidings.json"; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/json/sidings.json
            git commit -m "Auto-update sidings.json from Excel"
            git push
          else
            echo "No changes in sidings.json"
          fi
