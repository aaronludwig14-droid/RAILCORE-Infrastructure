name: Build infrastructure JSON from master Excel

on:
  push:
    branches: [ "main" ]
    paths:
      - "data/public/RAILCORE_Infrastructure_GitHubMaster.xlsx"
      - ".github/workflows/xlsx-to-json.yml"
      - "scripts/xlsx_to_json.py"

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl

      - name: Run converter
        run: python scripts/xlsx_to_json.py

      - name: Upload JSON as artifact
        uses: actions/upload-artifact@v3
        with:
          name: railcore-json
          path: data/json/*.json

      - name: Commit JSON back to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/json/*.json
          git commit -m "Auto-update JSON from master workbook" || echo "No changes"
          git push
